apiVersion: apps/v1
kind: Deployment
metadata:
  name: editor-frontend
spec:
  selector:
    matchLabels:
      app: editor-frontend
  template:
    metadata:
      labels:
        app: editor-frontend
    spec:
      containers:
        - name: editor-frontend
          image: yyz.ocir.io/yztdqx0npeqw/editor-frontend:latest
          ports:
            - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: editor-frontend-service
  annotations:
    service.beta.kubernetes.io/oci-load-balancer-shape: "10Mbps"
spec:
  selector:
    app: editor-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
  type: LoadBalancer # Internal service for frontend to call
