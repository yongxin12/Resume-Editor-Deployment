apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: resume-app
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
  - host: oci.mintmelon.ca
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: market-frontend-service
            port:
              number: 80
      - path: /modifier
        pathType: Prefix
        backend:
          service:
            name: editor-frontend-service
            port:
              number: 80 