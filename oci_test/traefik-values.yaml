# Global settings
global:
  checknewversion: true

# Enable dashboard
dashboard:
  enabled: true
  auth:
    basic:
      users:
        - "admin:$apr1$encrypted_password"  # You should change this password

# Configure entrypoints
ports:
  web:
    port: 80
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    tls:
      enabled: true

# Service configuration
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/oci-load-balancer-shape: "10Mbps"
  ports:
    - name: web
      port: 80
      targetPort: 80
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: 443
      protocol: TCP

# Enable Let's Encrypt
certificatesResolvers:
  letsencrypt:
    acme:
      email: worexow@gmail.com
      storage: /data/acme.json
      httpChallenge:
        entryPoint: web

# Resource limits
resources:
  requests:
    cpu: "100m"
    memory: "50Mi"
  limits:
    cpu: "300m"
    memory: "150Mi"

# Node affinity for specific node
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
              - 10.0.10.23

# Enable CRD
additionalArguments:
  - "--providers.kubernetescrd=true"
  - "--providers.kubernetescrd.allowcrossnamespace=true"
  - "--providers.kubernetescrd.allowexternalnameservices=true"
  - "--entrypoints.websecure.http.tls=true"
  - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
  - "--entrypoints.websecure.http.tls.domains[0].main=oci.mintmelon.ca"
  - "--entrypoints.websecure.http.tls.domains[0].sans=*.oci.mintmelon.ca"
  - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
  - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
  - "--log.level=DEBUG" 