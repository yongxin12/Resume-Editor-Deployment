apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-frontend
  namespace: resume-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-frontend
  template:
    metadata:
      labels:
        app: market-frontend
    spec:
      # Node affinity to ensure frontend runs on specific node
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - 10.0.10.23
      containers:
        - name: market-frontend
          image: yyz.ocir.io/yztdqx0npeqw/market-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_BACKEND_URL
              value: "/api/job_market"
            - name: REACT_APP_EDITOR_URL
              value: "/modifier"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: market-frontend-service
  namespace: resume-app
  annotations:
    service.beta.kubernetes.io/oci-load-balancer-shape: "10Mbps"
spec:
  selector:
    app: market-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
