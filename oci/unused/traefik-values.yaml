# Global settings
global:
  checknewversion: true

# Enable dashboard
dashboard:
  enabled: true
  auth:
    basic:
      users:
        - "admin:$apr1$encrypted_password"  # You should change this password

# Configure entrypoints
ports:
  web:
    port: 9080
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 9443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    tls:
      enabled: false  # Let OCI LB handle SSL termination

# Service configuration
service:
  type: NodePort
  annotations:
    service.beta.kubernetes.io/oci-load-balancer-shape: "10Mbps"
  ports:
    - name: web
      port: 80
      targetPort: 9080
      protocol: TCP
      nodePort: 31607
    - name: websecure 
      port: 443
      targetPort: 9443
      protocol: TCP
      nodePort: 30836

# Resource limits
resources:
  requests:
    cpu: "100m"
    memory: "50Mi"
  limits:
    cpu: "300m"
    memory: "150Mi"

# Enable CRD
additionalArguments:
  - "--providers.kubernetescrd=true"
  - "--providers.kubernetescrd.allowcrossnamespace=true"
  - "--providers.kubernetescrd.allowexternalnameservices=true"
  - "--log.level=INFO" 